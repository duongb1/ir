# Configuration for Stage 1 Training on S.I.S Dataset (Kaggle 1x P100 GPU Optimized)

# Kaggle Dataset Paths
report_path: "/kaggle/input/datasets/duongb/cthsis/report_cleaned.xlsx"
images_dir: "/kaggle/input/datasets/duongb/cthsis/images"
output_dir: "/kaggle/working/checkpoints"

# Data parameters
text_column: "KETLUAN_CLEAN"
id_column: "STT"
sequences:
  - "DWI"
  - "ADC"
target_image_size: [384, 384]
target_depth: 32
val_ratio: 0.10
test_ratio: 0.20
seed: 42
num_workers: 2

# Model parameters
text_model_name: "vinai/phobert-base"
dim_text: 768
dim_image: 512
dim_latent: 512
image_size: 384
patch_size: 16
temporal_patch_size: 4

# Training parameters for 1x GPU (P100 / T4)
batch_size: 4                      # Single-GPU batch size
gradient_accumulation_steps: 4     # Effective batch size = 4 x 4 = 16
use_amp: true                      # Automatic Mixed Precision (FP16)
epochs: 20
lr: 0.0001
weight_decay: 0.01
warmup_ratio: 0.1
save_every_epochs: 5
eval_every_epochs: 1
max_grad_norm: 1.0

# Loss parameters
use_triplet_loss: 1.0
use_infoNCE_loss: 1.0
temperature: 0.07
