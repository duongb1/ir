# Configuration for Stage 1 Training on S.I.S Dataset (Kaggle 2x T4 Optimized)

# Kaggle Dataset Paths
report_path: "/kaggle/input/datasets/duongb/cthsis/report_cleaned.xlsx"
images_dir: "/kaggle/input/datasets/duongb/cthsis/images"
output_dir: "/kaggle/working/checkpoints"

# Data parameters
text_column: "KETLUAN_CLEAN"
id_column: "STT"
sequences:
  - "DWI"
target_image_size: [480, 480]
target_depth: 32
val_ratio: 0.15
test_ratio: 0.15
seed: 42
num_workers: 4

# Model parameters
text_model_name: "vinai/phobert-base"
dim_text: 768
dim_image: 512
dim_latent: 512
image_size: 480
patch_size: 20
temporal_patch_size: 4

# Training parameters for 2x T4 GPUs
batch_size: 8              # Per-GPU batch size (Total effective batch size = 16 on 2 GPUs)
use_amp: true              # Automatic Mixed Precision (FP16) for NVIDIA T4 Tensor Cores
epochs: 20
lr: 0.0001
weight_decay: 0.01
warmup_ratio: 0.1
save_every_epochs: 5
eval_every_epochs: 1
max_grad_norm: 1.0

# Loss parameters
use_triplet_loss: 1.0
use_infoNCE_loss: 1.0
temperature: 0.07
