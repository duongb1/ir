# Configuration for Stage 1 Training on S.I.S Dataset

# Paths
report_path: "c:/Users/DUONG/Desktop/RadIR/S.I.S/report_cleaned.xlsx"
images_dir: "c:/Users/DUONG/Desktop/RadIR/S.I.S/images"
output_dir: "c:/Users/DUONG/Desktop/RadIR/S.I.S/stage1/checkpoints"

# Data parameters
text_column: "KETLUAN_CLEAN"
id_column: "STT"
sequences:
  - "DWI"
target_image_size: [480, 480]
target_depth: 32
val_ratio: 0.15
test_ratio: 0.15
seed: 42

# Model parameters
text_model_name: "vinai/phobert-base"
dim_text: 768
dim_image: 512
dim_latent: 512
image_size: 480
patch_size: 20
temporal_patch_size: 4

# Training parameters
batch_size: 8
epochs: 20
lr: 0.0001
weight_decay: 0.01
warmup_ratio: 0.1
save_every_epochs: 5
eval_every_epochs: 1
max_grad_norm: 1.0

# Loss parameters
use_triplet_loss: 1.0
use_infoNCE_loss: 1.0
temperature: 0.07
