# Configuration for Stage 1 Training on S.I.S Dataset (Kaggle 1x T4 GPU Optimized)

# Kaggle Dataset Paths
report_path: "/kaggle/input/datasets/duongb/cthsis/report_cleaned.xlsx"
images_dir: "/kaggle/input/datasets/duongb/cthsis/images"
output_dir: "/kaggle/working/checkpoints"

# Data parameters
text_column: "KETLUAN_CLEAN"
id_column: "STT"
sequences:
  - "DWI"
  - "ADC"
target_image_size: [256, 256]
target_depth: 32
val_ratio: 0.10
test_ratio: 0.20
seed: 42
num_workers: 2

# Model parameters
text_model_name: "vinai/phobert-base"
freeze_text_encoder: true           # Freeze PhoBERT encoder weights to save VRAM
dim_text: 768
dim_image: 512
dim_latent: 512
resnet_depth: 18                    # 3D ResNet depth: 18 (default, light & fast for 16GB VRAM) or 50
image_size: 256
patch_size: 16
temporal_patch_size: 4

# Training parameters for 1x GPU T4
batch_size: 2                      # Single GPU batch size (T4 16GB VRAM)
gradient_accumulation_steps: 8     # Effective batch size = 2 x 8 = 16
use_amp: true                      # Automatic Mixed Precision (FP16)
epochs: 20
lr: 0.0001
weight_decay: 0.01
warmup_ratio: 0.1
save_every_epochs: 5
eval_every_epochs: 1
max_grad_norm: 1.0

# Loss parameters
use_triplet_loss: 1.0
use_infoNCE_loss: 1.0
temperature: 0.07
