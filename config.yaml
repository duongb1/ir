# Configuration for Stage 1 Training on S.I.S Dataset (Kaggle 1x T4 GPU Optimized)

# Kaggle Dataset Paths
report_path: "/kaggle/input/datasets/duongb/cthsis/report_cleaned.xlsx"
images_dir: "/kaggle/input/datasets/duongb/cthsis/images"
output_dir: "/kaggle/working/checkpoints"

# Data parameters
text_column: "KETLUAN_CLEAN"
id_column: "STT"
sequences:
  - "DWI"
  - "ADC"
target_image_size: [256, 256]
target_depth: 32
val_ratio: 0.10
test_ratio: 0.20
seed: 42
num_workers: 2

# Model parameters
text_model_name: "vinai/phobert-base"
freeze_text_encoder: true           # Freeze PhoBERT encoder weights to save VRAM
vision_type: "mil_2d"               # Vision encoder: "mil_2d" (2D ABMIL + Lesion Map) or "resnet3d"
dim_text: 768
dim_image: 512
dim_latent: 512
resnet_depth: 18                    # 2D/3D ResNet depth: 18 (default, light & fast) or 50
image_size: 256
patch_size: 16
temporal_patch_size: 4

# Training parameters for 1x GPU T4 (Kaggle Optimized)
batch_size: 16                     # Single GPU batch size (16x256x256 image takes ~9.5GB VRAM)
gradient_accumulation_steps: 1     # Effective batch size = 16 x 1 = 16
use_amp: true                      # Automatic Mixed Precision (FP16)
epochs: 20
lr: 0.0001                          # Projection heads learning rate
backbone_lr: 0.00001                # Differential LR for pre-trained backbones (1e-5)
weight_decay: 0.01
warmup_ratio: 0.15                  # Smoother 15% warmup
save_every_epochs: 5
eval_every_epochs: 1
max_grad_norm: 1.0

# Loss parameters
use_triplet_loss: 1.0
use_infoNCE_loss: 1.0
triplet_loss_margin: 0.1            # Mild initial margin to prevent gradient shock
temperature: 0.07
